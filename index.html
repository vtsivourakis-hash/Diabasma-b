<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Διάβασμα Β΄ Γυμνασίου</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;600;800&family=Literata:ital,opsz,wght@0,7..72,400;1,7..72,400;1,7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAFBFD; --grid:#E3EAF5; --card:#FFFFFF; --line:#D3DBE8;
  --ink:#1F3A93; --on-ink:#FFFFFF; --text:#1E2430; --muted:#5B6475;
  --mark:#FFE15A; --mark-soft:#FFF7CC; --red:#D62839; --ok:#1E8E5A; --ok-soft:#E3F5EC;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141A22; --grid:#1D2531; --card:#1B2330; --line:#2E3A4B;
    --ink:#8FB0FF; --on-ink:#0F1622; --text:#E8ECF2; --muted:#9AA4B4;
    --mark:#8A7414; --mark-soft:#2F2B14; --red:#FF6B7A; --ok:#4CC38A; --ok-soft:#173528;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141A22; --grid:#1D2531; --card:#1B2330; --line:#2E3A4B;
  --ink:#8FB0FF; --on-ink:#0F1622; --text:#E8ECF2; --muted:#9AA4B4;
  --mark:#8A7414; --mark-soft:#2F2B14; --red:#FF6B7A; --ok:#4CC38A; --ok-soft:#173528;
  color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);background:var(--paper)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;color:var(--text);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  font-family:'Commissioner',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:17px;line-height:1.55;
}
.wrap{max-width:600px;margin:0 auto;padding:16px 18px 40px}
h1{font-weight:800;font-size:clamp(30px,9vw,40px);line-height:1.02;letter-spacing:-.02em;margin:10px 0 8px;color:var(--ink)}
.lede{margin:0;color:var(--muted);font-size:15px;max-width:44ch}
h2,h3{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.f{font-family:'Literata',Georgia,serif;font-style:italic}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;background:var(--paper);padding:12px 0 0;margin:14px 0 18px;border-bottom:2px solid var(--ink)}
.tab{flex:1;font-weight:600;font-size:15px;padding:10px 2px 12px;border:0;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab span{padding:0 3px}
.tab[aria-selected="true"]{color:var(--text)}
.tab[aria-selected="true"] span{background:linear-gradient(transparent 52%,var(--mark) 52%)}
.panel[hidden]{display:none}

.chap{margin:0 0 14px}
.ref{font-size:14px;color:var(--muted)}
.ct{font-size:24px;line-height:1.2;font-weight:800;margin-top:2px}
.seg{display:flex;gap:8px;margin-bottom:14px}
.seg button{flex:1;padding:10px 4px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-size:15px}
.seg button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:linear-gradient(transparent 70%,var(--mark) 70%),var(--card)}

.sheet{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:20px}
.blk{padding:14px 0;border-bottom:1.5px dashed var(--line)}
.blk:first-child{padding-top:0}
.blk:last-of-type{border-bottom:0}
.blk h3{font-size:17px;font-weight:800;color:var(--ink);margin-bottom:4px}
.blk p{margin:6px 0 0}
.blk.warn{background:var(--mark-soft);border:0;border-left:4px solid var(--red);border-radius:8px;padding:12px 14px;margin:6px 0}
.blk.warn h3{color:var(--red)}
.formula{font-size:21px;color:var(--ink);margin:6px 0 0}
.quote{font-family:'Literata',Georgia,serif;font-size:19px;color:var(--ink)}

.btn{display:block;width:100%;padding:14px 18px;border-radius:12px;border:2px solid var(--ink);background:var(--ink);color:var(--on-ink);font-weight:700;cursor:pointer;margin-top:12px}
.btn.ghost{background:transparent;color:var(--ink)}
.row{display:flex;gap:10px}.row .btn{flex:1}

.card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;width:100%;min-height:240px;padding:22px;text-align:center;border:1.5px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer}
.card.back{border-color:var(--ink)}
.card strong{font-size:21px;line-height:1.3}
.card .a{font-size:19px;line-height:1.45;color:var(--ink)}
.hint{font-size:14px;color:var(--muted)}
.count{text-align:center;font-size:14px;color:var(--muted);margin:10px 0 0}

.grade{position:relative;width:210px;height:150px;margin:6px auto 4px}
.grade svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.grade ellipse{fill:none;stroke:var(--red);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:560;stroke-dashoffset:560;animation:draw .9s .15s ease-out forwards}
.grade .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Literata',Georgia,serif;font-style:italic;font-weight:600;color:var(--red);font-size:64px;line-height:1;transform:rotate(-4deg)}
.grade .num small{font-size:26px;margin-left:4px;align-self:flex-end;margin-bottom:38px}
@keyframes draw{to{stroke-dashoffset:0}}
.center{text-align:center}

.ex{margin-bottom:12px}
.ex .n{font-size:14px;color:var(--muted)}
.ex .q{font-weight:600;margin:2px 0 0}
.ex .btn{margin-top:12px;padding:10px 14px}
.sol{margin-top:14px;padding-top:12px;border-top:1.5px dashed var(--line)}
.sol[hidden]{display:none}
.sol ol{margin:0;padding-left:22px}
.sol li{margin:0 0 6px}
.ans{margin:10px 0 0;font-weight:700;color:var(--ok)}
.ans span{background:linear-gradient(transparent 60%,var(--mark) 60%);color:var(--text);padding:0 2px}

.timer{text-align:center}
.ring{width:220px;height:220px;margin:6px auto 10px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:var(--grid)}
.ring .fg{stroke:var(--ink);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring .time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .time b{font-size:48px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ring .time span{font-size:15px;color:var(--muted)}
#tmsg{min-height:1.5em;margin:4px 0 0;font-weight:600;color:var(--ok)}

footer{margin-top:28px;font-size:14px;color:var(--muted);text-align:center}
footer p{margin:0 0 6px}
@media (prefers-reduced-motion: reduce){
  .grade ellipse{animation:none;stroke-dashoffset:0}
  .ring .fg{transition:none}
}
@media (max-width:370px){ .tab{font-size:14px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Διάβασμα Β΄&nbsp;Γυμνασίου</h1>
    <p class="lede">Μία ενότητα από κάθε βιβλίο, με σύντομη περίληψη, κάρτες επανάληψης και λυμένες ασκήσεις.</p>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-p="F"><span>Φυσική</span></button>
    <button class="tab" role="tab" aria-selected="false" data-p="M"><span>Μαθηματικά</span></button>
    <button class="tab" role="tab" aria-selected="false" data-p="A"><span>Αρχαία</span></button>
    <button class="tab" role="tab" aria-selected="false" data-p="timer"><span>Χρονόμετρο</span></button>
  </nav>

  <section class="panel" id="F"></section>
  <section class="panel" id="M" hidden></section>
  <section class="panel" id="A" hidden></section>
  <section class="panel" id="timer" hidden>
    <div class="sheet timer">
      <div class="seg" id="tmodes">
        <button data-m="study" aria-pressed="true">Μελέτη 25΄</button>
        <button data-m="rest" aria-pressed="false">Διάλειμμα 5΄</button>
      </div>
      <div class="ring">
        <svg viewBox="0 0 200 200" aria-hidden="true"><circle class="bg" cx="100" cy="100" r="88"/><circle class="fg" id="tfg" cx="100" cy="100" r="88"/></svg>
        <div class="time"><b id="tclock">25:00</b><span id="tlabel">Μελέτη</span></div>
      </div>
      <p id="tmsg" aria-live="polite"></p>
      <div class="row">
        <button class="btn" id="tgo">Ξεκίνα</button>
        <button class="btn ghost" id="treset">Επαναφορά</button>
      </div>
    </div>
  </section>

  <footer>
    <p>Βασισμένο στα σχολικά βιβλία της Β΄ Γυμνασίου (ebooks.edu.gr).</p>
    <p>Βρήκες λάθος ή θέλεις κι άλλη ενότητα; Πες το στον εκπρόσωπο της τάξης.</p>
  </footer>
</div>

<script>
const S = {
F: {
 title:"Η κίνηση των σωμάτων", ref:"Κεφάλαιο 1, ενότητα 1.1",
 exTitle:"Λυμένες ασκήσεις",
 summary:[
  {h:"Κίνηση και σύστημα αναφοράς", t:"Ένα σώμα κινείται όταν αλλάζει η θέση του σε σχέση με κάτι που θεωρούμε ακίνητο, το σύστημα αναφοράς. Ο επιβάτης ενός τρένου είναι ακίνητος για τον διπλανό του, αλλά κινείται για όποιον στέκεται στην αποβάθρα."},
  {h:"Θέση", t:"Πάνω σε έναν άξονα x με σημείο αναφοράς το 0, η θέση ενός σώματος είναι ένας αριθμός με πρόσημο. Ο αριθμός λέει πόσο απέχει από το 0 και το πρόσημο από ποια πλευρά βρίσκεται. Μονάδα στο S.I. είναι το 1 m."},
  {h:"Μετατόπιση", f:"Δx = x<sub>τελ</sub> − x<sub>αρχ</sub>", t:"Δείχνει πόσο και προς τα πού άλλαξε η θέση. Θετική μετατόπιση σημαίνει κίνηση προς τη θετική κατεύθυνση του άξονα, αρνητική προς την αντίθετη."},
  {h:"Απόσταση (διάστημα)", t:"Είναι το μήκος της διαδρομής που έκανε το σώμα, γι' αυτό δεν είναι ποτέ αρνητική."},

  {h:"Χρονική στιγμή και χρονική διάρκεια", f:"Δt = t<sub>τελ</sub> − t<sub>αρχ</sub>", t:"Η χρονική στιγμή t είναι η ένδειξη του ρολογιού σε μια θέση. Η χρονική διάρκεια Δt είναι πόσος χρόνος πέρασε από τη μία θέση στην άλλη."},

  {h:"Στιγμιαία ταχύτητα", t:"Είναι η ταχύτητα σε μια συγκεκριμένη στιγμή, αυτή που δείχνει το κοντέρ. Έχει μέτρο και κατεύθυνση, γι' αυτό είναι <b>διανυσματικό μέγεθος</b>, όπως και η μετατόπιση."}
 ],
 cards:[
  ["Τι είναι κίνηση;","Η μεταβολή της θέσης ενός σώματος σε σχέση με ένα σύστημα αναφοράς που θεωρούμε ακίνητο."],

  ["Ποια η διαφορά χρονικής στιγμής και χρονικής διάρκειας;","Στιγμή t είναι η ένδειξη του ρολογιού. Διάρκεια Δt = t<sub>τελ</sub> − t<sub>αρχ</sub> είναι πόσος χρόνος πέρασε."],

  ["Τι είναι η στιγμιαία ταχύτητα;","Η ταχύτητα σε μια συγκεκριμένη στιγμή, όπως τη δείχνει το κοντέρ. Έχει μέτρο και κατεύθυνση."],
  ["Τι είναι διανυσματικό μέγεθος;","Μέγεθος που χρειάζεται μέτρο και κατεύθυνση για να περιγραφεί, όπως η μετατόπιση και η στιγμιαία ταχύτητα."]
 ],

   ans:"Δx = −6 m και s = 6 m"},
  {q:"Ένα σώμα ξεκινά από x₁ = +1 m, πηγαίνει στο x₂ = +5 m και μετά γυρίζει στο x₃ = −1 m. Βρες τη μετατόπιση και την απόσταση.",
   steps:["Για τη μετατόπιση μετράνε μόνο η αρχή και το τέλος: Δx = x₃ − x₁ = (−1) − (+1) = −2 m.","Για την απόσταση μετράει όλη η διαδρομή: από το +1 στο +5 είναι 4 m και από το +5 στο −1 είναι 6 m.","Σύνολο: 4 + 6 = 10 m. Βγήκαν διαφορετικά επειδή το σώμα γύρισε πίσω."],

 ],

const $ = (s, r=document) => r.querySelector(s);
function shuffle(arr){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* Tabs */
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === t ? "true" : "false"));
  document.querySelectorAll(".panel").forEach(p => p.hidden = p.id !== t.dataset.p);
  window.scrollTo({top:0});
}));

/* Subjects */
const VIEWS = [["sum","Περίληψη"],["cards","Κάρτες"],["ex","Λυμένες"]];
const state = {};
function startCards(k){
  const st = state[k];
  st.queue = shuffle(S[k].cards.map((c,i) => ({q:c[0], a:c[1], i})));
  st.total = st.queue.length; st.missed = new Set(); st.knew = 0; st.flipped = false;
}
function setView(k, v){ state[k].view = v; render(k); const el = $("#"+k); el.scrollIntoView({block:"start"}); }

function render(k){
  const s = S[k], st = state[k], el = $("#"+k);
  let body = "";
  if(st.view === "sum"){
    body = `<div class="sheet">${s.summary.map(b => `<section class="blk${b.warn ? " warn" : ""}"><h3>${b.h}</h3>${b.quote ? `<p class="quote" lang="grc">${b.quote}</p>` : ""}${b.f ? `<p class="f formula">${b.f}</p>` : ""}<p>${b.t}</p></section>`).join("")}
      <button class="btn" data-go="cards">Έλεγξε τι θυμάσαι με τις κάρτες</button></div>`;
  } else if(st.view === "cards"){
    if(!st.queue.length){
      const g = Math.round(st.knew / st.total * 20);
      const msg = g >= 18 ? "Άριστα! Είσαι έτοιμος για το μάθημα." : g >= 14 ? "Πολύ καλά. Ξαναδιάβασε όσα σου ξέφυγαν." : "Καλή αρχή. Ρίξε μια ματιά στην περίληψη και ξαναδοκίμασε.";
      body = `<div class="sheet center">
        <div class="grade" role="img" aria-label="Βαθμός ${g} στα 20"><svg viewBox="0 0 210 150" aria-hidden="true"><ellipse cx="105" cy="76" rx="92" ry="60" transform="rotate(-6 105 76)"/></svg><div class="num">${g}<small>/20</small></div></div>
        <p>Ήξερες με την πρώτη ${st.knew} από ${st.total} κάρτες. ${msg}</p>
        <div class="row"><button class="btn" data-act="restart">Ξανά από την αρχή</button><button class="btn ghost" data-go="sum">Στην περίληψη</button></div></div>`;
    } else {
      const c = st.queue[0];
      body = `<button class="card${st.flipped ? " back" : ""}" data-act="flip" aria-live="polite">${st.flipped
          ? `<span class="hint">${c.q}</span><span class="a">${c.a}</span>`
          : `<strong>${c.q}</strong><span class="hint">Σκέψου την απάντηση και πάτα την κάρτα</span>`}</button>
        ${st.flipped ? `<div class="row"><button class="btn ghost" data-act="later">Ξανά αργότερα</button><button class="btn" data-act="knew">Το ήξερα</button></div>` : ""}
        <p class="count">Έμειναν ${st.queue.length} από ${st.total}</p>`;
    }
  } else {
    body = `<h3 style="font-size:17px;margin:0 0 10px">${s.exTitle}</h3>` + s.ex.map((e,i) => `<div class="sheet ex">
      <span class="n">${k === "A" ? "Ερώτηση" : "Άσκηση"} ${i+1}</span>
      <p class="q">${e.q}</p>
      <button class="btn ghost" data-sol="${i}" aria-expanded="false">Δες τη λύση</button>
      <div class="sol" id="${k}-sol-${i}" hidden><ol>${e.steps.map(x => `<li>${x}</li>`).join("")}</ol><p class="ans">Απάντηση: <span>${e.ans}</span></p></div>
    </div>`).join("") + `<p class="hint center">Δοκίμασε πρώτα μόνος σου και μετά δες τη λύση.</p>`;
  }
  el.innerHTML = `<div class="chap"><span class="ref">${s.ref}</span><h2 class="ct">${s.title}</h2></div>
    <div class="seg">${VIEWS.map(([v,l]) => `<button data-go="${v}" aria-pressed="${st.view === v}">${l}</button>`).join("")}</div>${body}`;

  el.querySelectorAll("[data-go]").forEach(b => b.onclick = () => setView(k, b.dataset.go));
  el.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
    const a = b.dataset.act;
    if(a === "flip"){ st.flipped = !st.flipped; }
    else if(a === "knew"){ const c = st.queue.shift(); if(!st.missed.has(c.i)) st.knew++; st.flipped = false; }
    else if(a === "later"){ const c = st.queue.shift(); st.missed.add(c.i); st.queue.push(c); st.flipped = false; }
    else if(a === "restart"){ startCards(k); }
    render(k);
  });
  el.querySelectorAll("[data-sol]").forEach(b => b.onclick = () => {
    const sol = $("#"+k+"-sol-"+b.dataset.sol);
    sol.hidden = !sol.hidden;
    b.setAttribute("aria-expanded", String(!sol.hidden));
    b.textContent = sol.hidden ? "Δες τη λύση" : "Κρύψε τη λύση";
  });
}
["F","M","A"].forEach(k => { state[k] = {view:"sum"}; startCards(k); render(k); });

/* Timer */
const MODES = { study:{min:25, label:"Μελέτη"}, rest:{min:5, label:"Διάλειμμα"} };
const C = 2 * Math.PI * 88;
const tm = { mode:"study", left:25*60, end:null, int:null };
const fg = $("#tfg");
fg.style.strokeDasharray = C;
function total(){ return MODES[tm.mode].min * 60; }
function drawT(){
  const m = Math.floor(tm.left / 60), s = tm.left % 60;
  const t = `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  $("#tclock").textContent = t;
  $("#tlabel").textContent = MODES[tm.mode].label;
  fg.style.strokeDashoffset = C * (1 - tm.left / total());
  $("#tgo").textContent = tm.end ? "Παύση" : (tm.left < total() ? "Συνέχεια" : "Ξεκίνα");
  document.title = tm.end ? `${t} ${MODES[tm.mode].label}` : "Διάβασμα Β΄ Γυμνασίου";
  document.querySelectorAll("#tmodes button").forEach(b => b.setAttribute("aria-pressed", b.dataset.m === tm.mode ? "true" : "false"));
}
function stopT(){ clearInterval(tm.int); tm.int = null; tm.end = null; }
function setMode(m){ stopT(); tm.mode = m; tm.left = total(); drawT(); }
function tick(){
  tm.left = Math.max(0, Math.round((tm.end - Date.now()) / 1000));
  if(tm.left === 0){
    const was = tm.mode;
    stopT();
    try { navigator.vibrate && navigator.vibrate([200,100,200]); } catch(e){}
    setMode(was === "study" ? "rest" : "study");
    $("#tmsg").textContent = was === "study" ? "Μπράβο! Ώρα για διάλειμμα." : "Τέλος το διάλειμμα. Πάμε πάλι!";
    return;
  }
  drawT();
}
$("#tgo").onclick = () => {
  $("#tmsg").textContent = "";
  if(tm.end){ stopT(); drawT(); }
  else { tm.end = Date.now() + tm.left * 1000; tm.int = setInterval(tick, 250); drawT(); }
};
$("#treset").onclick = () => { $("#tmsg").textContent = ""; setMode(tm.mode); };
document.querySelectorAll("#tmodes button").forEach(b => b.onclick = () => { $("#tmsg").textContent = ""; setMode(b.dataset.m); });
drawT();
</script>
